<style>
:root{--bg:#fffefb;--surface:#fff;--text:#2b2118;--muted:#7a6a5c;--accent:#c4542d;--accent-t:#fff;--border:#e6dccf;--danger:#b3261e;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

input[type=text],input[type=search],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}

.thumb button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--danger);color:#fff;cursor:pointer;line-height:1}

.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.item button{background:none;border:0;color:var(--danger);font-size:20px;cursor:pointer}

<body>
<main id="app"></main>
<div id="toast"></div>
<script>
var KEY = 'przepisy:v1';
var CATS = ['Śniadanie', 'Obiad', 'Kolacja', 'Deser', 'Inne'];
var flash = null, products = [], pdraft = null, pick = null, retForm = false, recipes = [], view = 'list', cur = null, draft = null, q = '', delArmed = false;
var app = document.getElementById('app');

function load() { try { var r = localStorage.getItem(KEY); recipes = r ? JSON.parse(r) : []; } catch (e) { recipes = []; } }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(recipes)); return true; }
  catch (e) { toast('Brak miejsca w pamięci przeglądarki – usuń część zdjęć'); return false; }
}
function toast(m) {
  var t = document.getElementById('toast'); t.textContent = m; t.classList.add('on');
  setTimeout(function () { t.classList.remove('on'); }, 2600);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function lines(s) { return String(s || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean); }

// Zdjęcie: zmniejszamy i kompresujemy, żeby zmieściło się w pamięci przeglądarki
function shrink(file) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onerror = rej;
    fr.onload = function () {
      var img = new Image();
      img.onerror = rej;
      img.onload = function () {
        var s = Math.min(1, 900 / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.7));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function go(v, id) { view = v; cur = id || null; delArmed = false; render(); window.scrollTo(0, 0); }

function render() {
  if (view === 'list') renderList();
  else if (view === 'form') renderForm();
  else if (view === 'products') renderProducts();
  else renderDetail();
}

/* ---------- Lista ---------- */
function renderList() {
  app.innerHTML =
    '<div class="head"><h1>Przepisy od Dida</h1><div class="row"><button class="btn ghost" id="mscan">📷 Skanuj</button><button class="btn ghost" id="prod">🥕 Produkty</button><button class="btn" id="add">+ Nowy</button></div><div class="themes" id="themes"></div></div>' +
    '<input type="search" id="q" placeholder="Szukaj po nazwie lub składniku…" value="' + esc(q) + '">' +
    '<div id="grid"></div>';
  document.getElementById('add').onclick = function () {
    draft = { title: '', category: 'Obiad', time: '', servings: '', ingredients: '', steps: '', photos: [], items: [] }; pick = null;
    go('form');
  };
  document.getElementById('q').oninput = function (e) { q = e.target.value; flash = null; renderGrid(); };
  document.getElementById('prod').onclick = function () { retForm = false; pdraft = null; go('products'); };
  document.getElementById('mscan').onclick = function () { openScan(function (c) { handleScan(c, false); }); };
  buildThemes();
  renderGrid();
}
function renderGrid() {
  var ql = q.toLowerCase();
  var list = recipes.filter(function (r) { return !ql || (r.title + ' ' + r.ingredients).toLowerCase().indexOf(ql) > -1; });
  var g = document.getElementById('grid');
  if (!list.length) {
    g.innerHTML = '<div class="empty">' + (recipes.length ? 'Nic nie znaleziono.' : 'Nie masz jeszcze przepisów.<br>Dodaj pierwszy przyciskiem „+ Nowy”.') + '</div>';
    return;
  }
  g.className = 'grid';
  g.innerHTML = list.map(function (r) {

  });

      if (isNew) { q = ''; flash = d.id; toast('Dodano na stronę główną'); go('list'); }

    }
    else { recipes = backup; if (!backup.some(function (r) { return r.id === d.id; })) delete d.id; }
  };
}

  app.innerHTML =
    '<div class="row between"><button class="btn ghost" id="back">← Wróć</button><div class="row"><button class="btn ghost" id="edit">Edytuj</button><button class="btn danger" id="del">' + (delArmed ? 'Na pewno?' : 'Usuń') + '</button></div></div>' +

    (ph.length ? '<img class="hero" id="hero" src="' + ph[0] + '" alt="" style="margin-top:14px">' : '') +
    (ph.length > 1 ? '<div class="gal">' + ph.map(function (p, i) { return '<img data-p="' + i + '" src="' + p + '" alt="">'; }).join('') + '</div>' : '') +

  document.getElementById('back').onclick = function () { go('list'); };
  document.getElementById('edit').onclick = function () { draft = JSON.parse(JSON.stringify(r)); pick = null; go('form'); };

    if (!delArmed) { delArmed = true; renderDetail(); return; }

  };
  app.querySelectorAll('[data-p]').forEach(function (i) {

  });
}

  list = list.filter(function (p) { return pfilt === 'all' || (pfilt === 'spice' ? p.spice : pfilt === 'own' ? p.own : !p.spice); });
  el.innerHTML = list.map(function (p, ix) {
    var parts = p.name.split(' ('), sub = parts[1] ? parts[1].replace(')', '') : (p.barcode ? 'kod ' + p.barcode : '');
    return `<div class='tile' data-add='${ix}' style='cursor:pointer'>${nsBadge(p.ns)}${p.own ? `<button class='x' data-dp='${p.id}' aria-label='Usuń'>×</button>` : ''}<div class='ti'>${p.ico || pIcon(p.name)}</div><b>${esc(parts[0])}</b><small>${esc(sub)}</small><div class='kk'>${p.kcal} <span style='font-size:12px;font-weight:600'>kcal</span></div><div class='mini'><span class='chip p'>B ${p.p || 0}</span><span class='chip f'>T ${p.f || 0}</span><span class='chip c'>W ${p.c || 0}</span></div><small style='color:var(--accent);font-weight:600;margin-top:6px'>+ do przepisu</small></div>`;
  }).join('') || `<div class='empty' style='grid-column:1/-1'>Brak wyników</div>`;
  el.querySelectorAll('[data-add]').forEach(function (t) { t.onclick = function (e) { if (e.target.closest('[data-dp]')) return; var p = list[+t.dataset.add]; if (!retForm || !draft) draft = { title: '', category: 'Obiad', time: '', servings: '', ingredients: '', steps: '', photos: [], items: [] }; retForm = false; pdraft = null; pick = p; go('form'); }; });
  el.querySelectorAll('[data-dp]').forEach(function (b) { b.onclick = function () { products = products.filter(function (x) { return x.id !== b.dataset.dp; }); saveProducts(); renderPL(); }; });
  el.querySelectorAll('.tile').forEach(function (t, i) { t.onclick = function (e) { if (e.target.closest('.x')) return; openProduct(list[i]); }; });
}
function renderPLold() {
  var s = (document.getElementById('pq').value || '').toLowerCase(), el = document.getElementById('pl');
  var list = allProducts().filter(function (p) { return !s || p.name.toLowerCase().indexOf(s) > -1 || (p.barcode || '').indexOf(s) > -1; });
  el.innerHTML = list.map(function (p) { return `<div class='item'><span>${esc(p.name)} ${nsBadge(p.ns)}${p.barcode ? `<br><small class='kc'>kod ${esc(p.barcode)}</small>` : ''}</span><span style='text-align:right'>${p.kcal} kcal<br><small class='kc'>B ${p.p || 0} · T ${p.f || 0} · W ${p.c || 0}</small>${p.own ? ` <button data-dp='${p.id}' aria-label='Usuń'>×</button>` : ''}</span></div>`; }).join('') || `<div class='empty'>Brak wyników</div>`;
  el.querySelectorAll('[data-dp]').forEach(function (b) { b.onclick = function () { products = products.filter(function (x) { return x.id !== b.dataset.dp; }); saveProducts(); renderPL(); }; });
}

var THEMES = [['zielen', 'Butelkowa zieleń', '#2f4a3f', '#c4a868'], ['terakota', 'Terakota', '#9a5a3c', '#e6c9a0'], ['granat', 'Granat i mgła', '#34507a', '#b9c6e0'], ['roz', 'Pudrowy róż', '#96526a', '#efcfd3'], ['noc', 'Noc', '#12171a', '#7fb59c']];
function setTheme(t) { document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('motyw:v1', t); } catch (e) {} }
function loadTheme() { var t = 'zielen'; try { t = localStorage.getItem('motyw:v1') || 'zielen'; } catch (e) {} document.documentElement.setAttribute('data-theme', t); }
function buildThemes() {
  var box = document.getElementById('themes'); if (!box) return;
  var cur = document.documentElement.getAttribute('data-theme');
  box.innerHTML = THEMES.map(function (t) { return `<button class='sw${t[0] === cur ? ' on' : ''}' data-th='${t[0]}' title='${t[1]}' aria-label='${t[1]}' style='background:linear-gradient(135deg,${t[2]} 50%,${t[3]} 50%)'></button>`; }).join('');
  box.querySelectorAll('[data-th]').forEach(function (b) { b.onclick = function () { setTheme(b.dataset.th); buildThemes(); }; });
}
loadTheme();
loadProducts();
load();
render();
</script>
</body>
